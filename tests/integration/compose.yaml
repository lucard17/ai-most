# Disposable Mattermost for integration tests. Data lives in tmpfs: `down.sh` (or a reboot) wipes everything.
# Bound to 127.0.0.1 only. Start: tests/integration/up.sh  Stop: tests/integration/down.sh
name: aimost-it
services:
  db:
    image: postgres:17-alpine
    mem_limit: 512m
    environment:
      POSTGRES_USER: mmuser
      POSTGRES_PASSWORD: mmuser-it
      POSTGRES_DB: mattermost
    tmpfs: [/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mmuser -d mattermost"]
      interval: 2s
      retries: 30
  app:
    image: mattermost/mattermost-team-edition:12.1.0
    mem_limit: 2g
    depends_on: {db: {condition: service_healthy}}
    ports: ["127.0.0.1:${AIMOST_IT_PORT:-8067}:8065"]
    tmpfs: ["/mattermost/data:uid=2000,gid=2000", "/mattermost/logs:uid=2000,gid=2000",
            "/mattermost/plugins:uid=2000,gid=2000", "/mattermost/client/plugins:uid=2000,gid=2000"]
    environment:
      MM_SQLSETTINGS_DRIVERNAME: postgres
      MM_SQLSETTINGS_DATASOURCE: postgres://mmuser:mmuser-it@db:5432/mattermost?sslmode=disable&connect_timeout=10
      MM_SERVICESETTINGS_SITEURL: http://127.0.0.1:${AIMOST_IT_PORT:-8067}
      MM_SERVICESETTINGS_ENABLELOCALMODE: "true"
      MM_SERVICESETTINGS_ENABLEBOTACCOUNTCREATION: "true"
      MM_SERVICESETTINGS_ENABLEUSERACCESSTOKENS: "true"
      MM_SERVICESETTINGS_ENABLEPOSTUSERNAMEOVERRIDE: "true"
      MM_SERVICESETTINGS_ALLOWEDUNTRUSTEDINTERNALCONNECTIONS: "edge"
      MM_RATELIMITSETTINGS_ENABLE: "false"
      MM_LOGSETTINGS_ENABLEDIAGNOSTICS: "false"
      MM_LOGSETTINGS_CONSOLELEVEL: "ERROR"
      MM_TEAMSETTINGS_ENABLEOPENSERVER: "false"
      MM_PLUGINSETTINGS_ENABLE: "false"
    healthcheck:
      test: ["CMD", "/mattermost/bin/mmctl", "--local", "system", "status"]   # the image has no shell or curl
      interval: 3s
      retries: 60
  # The edge (aimost edge serve) from this checkout's src, as Mattermost sees it: http://edge:8767 (the name is in
  # AllowedUntrustedInternalConnections above). Started by edge-up.sh once the world exists (profile "edge"), so that
  # starting or restarting it never touches the Mattermost data. Re-executes itself when src changes.
  edge:
    profiles: [edge]
    image: python:3.12-alpine
    mem_limit: 128m
    command: ["python", "-u", "-m", "aimost", "edge", "serve"]
    volumes: ["../../src:/src:ro"]
    tmpfs: [/edge-data]
    ports: ["127.0.0.1:${AIMOST_IT_EDGE_PORT:-8068}:8767"]
    env_file: [{path: edge.env, required: false}]
    environment:
      PYTHONPATH: /src
      PYTHONDONTWRITEBYTECODE: "1"
      EDGE_MM_URL: http://app:8065
      EDGE_LISTEN: 0.0.0.0:8767
      EDGE_PUBLIC: edge:8767
      EDGE_KEYS_FILE: /edge-data/edge-keys.json
      EDGE_UNFOLLOW_EVERY_S: "0"
networks:
  default:
    # Explicit small subnet: hosts with many Docker networks run out of default address pools.
    ipam:
      config: [{subnet: "${AIMOST_IT_SUBNET:-10.217.67.0/28}"}]
