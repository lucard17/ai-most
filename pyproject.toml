[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-most"
version = "0.1.5"
description = "Bridge between Claude Code / Codex agent sessions and a Mattermost server: one bot per role, session inboxes, sender authority, buttons and confirmations."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
dependencies = []
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
]

[project.scripts]
aimost = "aimost.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aimost = ["data/*/*"]
