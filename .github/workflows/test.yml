name: test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  unit:
    name: unit (python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: unit tests (no Mattermost)
        run: AIMOST_IT=0 python -m unittest discover -s tests -t tests -v
  unit-oldest:
    # the floor (requires-python >= 3.8): runners no longer ship it, the official image does
    name: unit (python 3.8)
    runs-on: ubuntu-latest
    container: python:3.8-slim
    steps:
      - name: git (the slim image has none; some tests read a repository)
        run: apt-get update -qq && apt-get install -y -qq git >/dev/null
      - uses: actions/checkout@v5
      - name: unit tests (no Mattermost)
        run: AIMOST_IT=0 python -m unittest discover -s tests -t tests -v
  integration:
    name: integration (disposable Mattermost)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: start Mattermost
        run: tests/integration/up.sh
      - name: all tests
        run: python -m unittest discover -s tests -t tests -v
      - name: server logs on failure
        if: failure()
        run: docker compose -f tests/integration/compose.yaml logs --tail 200 app
      - name: stop
        if: always()
        run: tests/integration/down.sh
