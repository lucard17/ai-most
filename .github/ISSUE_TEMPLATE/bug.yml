name: Bug
description: Something in the bridge does not work as the spec says
labels: [bug]
body:
  - type: textarea
    attributes:
      label: What happened
      description: Command or chat action, what you expected, what you got. Remove tokens and hostnames.
    validations: {required: true}
  - type: textarea
    attributes:
      label: How to reproduce
  - type: input
    attributes:
      label: Versions
      description: "`aimost --version`, Python, Mattermost server, Claude Code / Codex"
